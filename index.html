<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style/app.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>NIIS — No-Input Instrument for Smartphone</title>
</head>
<body>
   <div id="rotate-overlay">&#8635; rotate device</div>

   <div id="app-root">

        <div id="enter-overlay">
            <div id="enter-content">
              <div id="enter-text"></div>
              <button id="enter-button" type="button"> >>> </button>
            </div>
        </div>

        <!-- Transport header -->
        <div class="mixer-header">
          <span class="mixer-title">NO—INPUT</span>
          <span class="mixer-sub">NIIS</span>
        </div>

        <!-- Waveform display -->
        <div id="oscilloscope-container">
          <canvas id="oscilloscope" width="320" height="70"></canvas>
        </div>

        <!-- 6 vertical channel faders (built by JS) -->
        <div id="faders-container"></div>

        <!-- Transport -->
        <div class="btn-row">
          <button id="btn-trig"       type="button" class="transport-btn">TRIG</button>
          <button id="btn-start-stop" type="button" class="transport-btn active">STOP</button>
        </div>

   </div>

   <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.4.2/rnbo.min.js"></script>
   <script type="text/javascript" src="js/app.js"></script>
</body>
</html>
